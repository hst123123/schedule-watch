name: Check schedule page

on:
  # Triggered externally by cron-job.org calling the GitHub API's
  # workflow_dispatch endpoint on a schedule, since GitHub's native
  # `schedule:` trigger was unreliable for this repo. Also lets you
  # trigger it manually from the Actions tab's "Run workflow" button.
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_schedule.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update state"
          git push
